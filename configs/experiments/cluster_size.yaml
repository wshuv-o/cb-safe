# Privacy-robustness trade-off: the median across cluster sums for cluster sizes
# c = 1 (no secure aggregation), 3, and 5 on CIFAR-10 under sign-flip.
task: robustness
dataset: cifar10
attack: signflip
method: median
rounds: 50
n_clients: 30
root_policy: per_method
cluster_size: [1, 3, 5]
f: [0.05, 0.1, 0.2, 0.3]
seed: [0, 1, 2]
