# Client-population scaling, N = 100 (FashionMNIST, sign-flip f = 0.2, 30 rounds; Table II).
task: robustness
dataset: fmnist
attack: signflip
f: 0.2
n_clients: 100
rounds: 30
cluster_size: 3
root_policy: always_exclude
seed: [0, 1, 2]
output: {dir: scale}
grid:
  - method: hybrid_ov4
    temporal: false   # the reported N = 100 runs used simultaneous overlap for CB-SAFE+
  - method: [fltrust, median, geomedian, krum, bulyan, trimmed, mean]
