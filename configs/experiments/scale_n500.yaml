# Client-population scaling, N = 500 (FashionMNIST, sign-flip f = 0.2, 50 rounds;
# Table II, Fig. 3). Seeds 0, 2, 3 are the ones reported.
task: robustness
dataset: fmnist
attack: signflip
f: 0.2
