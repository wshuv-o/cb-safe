# Duty-cycled attacker: malicious clients poison only a fraction of rounds
# (CIFAR-10, f = 0.2; Table VIII).
task: robustness
dataset: cifar10
attack: signflip
f: 0.2
method: hybrid_ov4
rounds: 50
n_clients: 30
cluster_size: 3
root_policy: per_method
duty: [0.5, 0.7, 0.8, 0.84, 0.9]
seed: [0, 1, 2]
output: {dir: duty_sweep}
